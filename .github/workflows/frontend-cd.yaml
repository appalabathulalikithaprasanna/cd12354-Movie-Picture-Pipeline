name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - starter/frontend/**
  workflow_dispatch:

jobs:
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        working-directory: starter/frontend
        run: npm ci

      - name: Check code style
        working-directory: starter/frontend
        run: npm run lint

  test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        working-directory: starter/frontend
        run: npm ci

      - name: Execute frontend tests
        working-directory: starter/frontend
        run: npm test -- --watchAll=false

  build:
    name: Build and Push Frontend Container
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${{ secrets.REACT_APP_MOVIE_API_URL }}" \
            -t 697420612282.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }} \
            ./starter/frontend

      - name: Push Docker image to ECR
        run: |
          docker push \
            697420612282.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}

  deploy:
    name: Deploy Frontend to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k starter/frontend/k8s

      - name: Update Kubernetes image
        run: |
          kubectl set image deployment/frontend \
            frontend=697420612282.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }} \
            -n default

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n default --timeout=300s