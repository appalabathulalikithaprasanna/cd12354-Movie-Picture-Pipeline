name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - starter/backend/**
  workflow_dispatch:

jobs:
  lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend packages
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Check code style
        working-directory: starter/backend
        run: pipenv run lint

  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install Pipenv
        run: python -m pip install pipenv

      - name: Install backend packages
        working-directory: starter/backend
        run: pipenv install --dev --deploy

      - name: Execute backend tests
        working-directory: starter/backend
        run: pipenv run test

  build:
    name: Build and Push Backend Container
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t 697420612282.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }} \
            ./starter/backend

      - name: Push Docker image to ECR
        run: |
          docker push \
            697420612282.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }}

  deploy:
    name: Deploy Backend to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Connect kubectl to EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name cluster

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -k starter/backend/k8s

      - name: Update Kubernetes image
        run: |
          kubectl set image deployment/backend \
            backend=697420612282.dkr.ecr.us-east-1.amazonaws.com/backend:${{ github.sha }} \
            -n default

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend -n default