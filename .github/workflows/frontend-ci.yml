name: Frontend Quality Pipeline

on:
  pull_request:
    branches:
      - main
    paths:
      - starter/frontend/**
  workflow_dispatch:

jobs:
  code-check:
    name: Check frontend linting
    runs-on: ubuntu-latest

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        working-directory: starter/frontend
        run: npm ci

      - name: Validate JavaScript style
        working-directory: starter/frontend
        run: npm run lint

  automated-tests:
    name: Verify frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Prepare Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install frontend packages
        working-directory: starter/frontend
        run: npm ci

      - name: Execute test suite
        working-directory: starter/frontend
        run: CI=true npm test -- --watchAll=false

  container-build:
    name: Create frontend container
    runs-on: ubuntu-latest
    needs:
      - code-check
      - automated-tests

    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: starter/frontend
        env:
          MOVIE_API_ENDPOINT: http://localhost:5000
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_ENDPOINT" \
            --tag "mp-frontend:${{ github.sha }}" \
            .